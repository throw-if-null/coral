name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: The commit to test. The release workflow passes a release PR's merge commit.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # In a called workflow, github.workflow and github.ref are the caller's, so the input keeps two releases apart.
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty outside workflow_call, which checks out the event's commit.
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      # A release PR must stay a consistent release of its version. An update from main that
      # brings changes the release section does not record fails here, before the merge.
      - name: Check the release
        if: startsWith(github.head_ref, 'release/')
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/release-check.mjs "${HEAD_REF#release/}"

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        # Naming bash enables pipefail, so the tee in the test step cannot mask a failing go test.
        shell: bash
        working-directory: examples/go-api-slice
    services:
      postgres:
        # postgres:17, pinned to its multi-platform image index.
        image: postgres:17@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf
        env:
          # The container exists for this job only. The password protects nothing.
          POSTGRES_PASSWORD: coral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty outside workflow_call, which checks out the event's commit.
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Action inputs resolve from the repository root. working-directory applies to run steps only.
          go-version-file: examples/go-api-slice/go.mod
          cache-dependency-path: examples/go-api-slice/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        env:
          DATABASE_URL: postgres://postgres:coral@localhost:5432/postgres?sslmode=disable
        run: |
          go test -v ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
          # The Postgres tests skip, and pass, when DATABASE_URL is unset; set but unreachable, they fail.
          # A skip here means the variable did not reach go test, so it fails the job.
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/go-test.log"; then
            echo "::error::a test skipped; every test must run in CI"
            exit 1
          fi
